<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Helper</title>
    <style>
        *{box-sizing:border-box}
        body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef4ff;color:#183b72}
        .app{max-width:760px;margin:0 auto;padding:24px 16px 40px}
        .card{background:white;border:1px solid #cbd5e1;border-radius:20px;padding:22px;box-shadow:0 4px 18px rgba(15,23,42,.08)}
        .brain{text-align:center;font-size:64px}
        h1{text-align:center;margin:4px 0;color:#1d4ed8;font-weight:850}
        .subtitle{text-align:center;color:#3b82f6;font-weight:600;margin-top:0}
        input{width:100%;min-height:50px;font-size:16px;border:1px solid #cbd5e1;border-radius:13px;padding:12px}
        .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
        .btn{width:100%;min-height:52px;border:1px solid #93c5fd;background:white;border-radius:15px;padding:14px;text-align:left;font-weight:800;font-size:16px;color:#2563eb;cursor:pointer}
        .btn:hover{background:#eff6ff}
        .btn:active{transform:scale(.98)}
        .primary{background:#2563eb;color:white;border-color:#2563eb;text-align:center}
        .back{border:0;background:none;color:#7c3aed;font-weight:700;font-size:16px;padding:6px 0 14px;cursor:pointer}
        .full{margin-top:14px}
        .item{margin-bottom:10px}.sport-list{display:flex;flex-direction:column;gap:18px}.sport-topic{min-height:58px}
        .center{text-align:center}
        @media(max-width:520px){.grid{grid-template-columns:1fr}}
    </style>
</head>

      "Maths": [
        ["What is 9 × 8?", ["64", "72", "81", "63"], 1],
        ["What is 144 ÷ 12?", ["10", "11", "12", "14"], 2],
        ["What is 25% of 100?", ["20", "25", "50", "75"], 1],

      ],
      "History": [

    const screen=document.getElementById("screen");

    function home(){
    screen.innerHTML=`<div class="card">
    <div class="brain">🧠</div><h1>Knowledge Helper</h1><p class="subtitle">Everything for your brain</p>
    <input id="globalSearch" placeholder="🔍 Search any country or topic...">
    <div style="height:18px"></div>
    <div class="grid">
    ${[["🏟️","Sports"],["🌎","Countries"],["🏛","Mythology"],["📚","Science"]].map(x=>`<button class="btn" onclick="openPage('${x[1]}')">${x[0]}${x[1]}</button>`).join("")}
    </div>
    ${[["🗺️","History"],["➗","Maths"],["🔤","English"],["🎯","Quiz Menu"],["⚙️","Settings"]].map(x=>`<button class="btn full" onclick="openPage('${x[1]}')">${x[0]}${x[1]}</button>`).join("")}
    </div>`;
    document.getElementById("globalSearch").addEventListener("keydown",e=>{
      if(e.key==="Enter"&&e.target.value.trim()){
        const val=e.target.value.trim();
        const found=Object.keys(countryDetails).find(c=>c.toLowerCase().includes(val.toLowerCase()));
        if(found) {
          showCountry(found);
        } else {
          screen.innerHTML=`<div class="card"><button class="back" onclick="home()">← Home</button><h2>🔍 Search: ${val}</h2><p>That's an awesome topic! Check out our Countries or Science tabs to explore more.</p></div>`;
        }
      }
    });
    }

    function openPage(name){
    if(name==="Quiz Menu")return quizMenu();
    if(name==="Settings"){screen.innerHTML=`<div class="card"><button class="back" onclick="home()">← Home</button><h2>⚙️ Settings</h2><p>Knowledge Helper app is ready for kids to learn and play!</p></div>`;return}
    const arr=topics[name];
    screen.innerHTML=`<div><button class="back" onclick="home()">← Home</button><h2>${name}</h2><div class="grid">${arr.map((x,i)=>`<button class="btn" onclick="topic('${name}',${i})">${Array.isArray(x)?x[0]:x}</button>`).join("")}</div></div>`;
    }

    function topic(name,i){
    const item=topics[name][i];
    if(name==="Sports" && sportDetails[item]){
      screen.innerHTML=`<div><button class="back" onclick="openPage('Sports')">← Sports</button><h2>${item}</h2><div class="sport-list">${sportDetails[item].map((x,j)=>`<button class="btn sport-topic" onclick="sportLesson(${JSON.stringify(item)},${j})">${x[0]}</button>`).join("")}</div></div>`;
      return;
    }
    if(name==="Countries"){
      showCountry(item);
      return;
    }
    if(Array.isArray(item)){
      screen.innerHTML=`<div class="card"><button class="back" onclick="openPage('${name}')">← ${name}</button><h2>${item[0]}</h2><p style="font-size:18px;line-height:1.6">${item[1]}</p></div>`;
      return;
    }
    }

    function showCountry(countryName){
    const info=countryDetails[countryName]||{capital:"Capital city",region:"Global Region",language:"Official Language",fact:"A fantastic country to learn about and explore with friends!"};
    screen.innerHTML=`<div class="card"><button class="back" onclick="openPage('Countries')">← Countries</button><h2>${countryName}</h2><p><strong>🏛️ Capital:</strong> ${info.capital}</p><p><strong>🌍 Region:</strong> ${info.region}</p><p><strong>🗣️ Language:</strong> ${info.language}</p><p><strong>✨ Fun Fact:</strong> ${info.fact}</p></div>`;
    }

    function sportLesson(sport,i){
    const x=sportDetails[sport][i];
    screen.innerHTML=`<div class="card"><button class="back" onclick="topic('Sports',${topics.Sports.indexOf(sport)})">← ${sport}</button><h2>${x[0]}</h2><p style="font-size:18px;line-height:1.65">${x[1]}</p></div>`;
    }

    function quizMenu(){
    screen.innerHTML=`<div><button class="back" onclick="home()">← Home</button><h2>🎯 Subject Quizzes</h2><div class="grid">
    ${Object.keys(quizzes).map(q=>`<button class="btn full" onclick="startQuiz('${q}')">🎯 ${q} Quiz</button>`).join("")}
    </div></div>`;
    }

    function startQuiz(quizName){
    const qs=quizzes[quizName];
    let i=0,score=0;
    function show(){
    const q=qs[i];
    screen.innerHTML=`<div class="card"><button class="back" onclick="quizMenu()">← Quizzes</button><h2>🎯 ${quizName} Quiz</h2><p>Question ${i+1} of ${qs.length}</p><h3>${q[0]}</h3>${q[1].map((a,n)=>`<button class="btn item answer">${String.fromCharCode(65+n)})${a}</button>`).join("")}</div>`;
    document.querySelectorAll(".answer").forEach((b,n)=>b.addEventListener("click",()=>{
    if(n===q[2])score++;
    document.querySelectorAll(".answer").forEach(x=>x.disabled=true);
    setTimeout(()=>{i++;i<qs.length?show():screen.innerHTML=`<div class="card center"><h2>🏆 Quiz Complete!</h2><p style="font-size:24px">You scored <strong>${score}/${qs.length}</strong></p><button class="btn primary" onclick="startQuiz('${quizName}')">Play Again</button><button class="back" onclick="quizMenu()">← Back to Quizzes</button></div>`},450);
    }));
    }
    show();
    }

    home();
</script>
</body>
</html>
